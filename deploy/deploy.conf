# AK Textiles deployment configuration.
# Edit these values to change deploy behavior — the scripts in this
# folder never need to be touched for routine changes like switching
# which branch gets deployed.
#
# Anything already set as an environment variable (e.g.
# `BACKEND_BRANCH=develop ./deploy/deploy-backend.sh ...`) takes
# priority over the values here.

# Server connection
: "${SERVER_IP:=13.126.206.134}"
: "${SERVER_USER:=ubuntu}"

# Which git branch to deploy on each side. These can differ — e.g. you
# can deploy `develop` for the backend while the frontend stays on
# `master`.
: "${BACKEND_BRANCH:=master}"
: "${FRONTEND_BRANCH:=master}"

# Where the frontend's built files live on the server (served by Nginx).
: "${REMOTE_FRONTEND_DIR:=/var/www/ak-textiles-frontend}"
